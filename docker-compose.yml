services:
  trainer:
    build:
      context: .
      dockerfile: Dockerfile
    image: pybrosai:cuda
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "${OMP_NUM_THREADS:-1}"
      MKL_NUM_THREADS: "${MKL_NUM_THREADS:-1}"
    volumes:
      - ./roms:/workspace/roms:ro
      - ./checkpoints:/workspace/checkpoints
    entrypoint: ["python", "ppo_train.py"]
    command:
      - --rom
      - /workspace/roms/Super Mario Bros. Deluxe.gbc
      - --device
      - cuda
      - --num-envs
      - "${NUM_ENVS:-12}"
      - --rollout-steps
      - "${ROLLOUT_STEPS:-256}"
      - --minibatch-size
      - "${MINIBATCH_SIZE:-4096}"
      - --update-epochs
      - "${UPDATE_EPOCHS:-4}"
      - --frame-skip
      - "${FRAME_SKIP:-2}"
      - --frame-stack
      - "${FRAME_STACK:-12}"
      - --total-steps
      - "${TOTAL_STEPS:-1000000000}"
      - --checkpoint
      - /workspace/checkpoints/mario_deluxe_recurrent_ppo_v18.pt
      - --curriculum-targets
      - "${CURRICULUM_TARGETS:-1000,1500,2000,2500}"
      - --curriculum-stage-steps
      - "${CURRICULUM_STAGE_STEPS:-2000000}"
      - --levels
      - "${LEVELS:-1-1,1-2,1-3,2-1,2-3,3-1,3-2,3-3,4-1,4-2,4-3}"
      - --training-levels
      - "${TRAINING_LEVELS:-1-1,1-2,1-2,1-3,1-3,2-1,2-3,3-1,3-2,3-3,4-1,4-2,4-3}"
      - --max-episode-steps
      - "${MAX_EPISODE_STEPS:-6000}"
      - --max-stagnation-steps
      - "${MAX_STAGNATION_STEPS:-2400}"
